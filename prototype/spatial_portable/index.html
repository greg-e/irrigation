<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Mapping Portable Prototype</title>
  <!-- Salesforce Lightning Design System -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@salesforce-ux/design-system@latest/assets/styles/salesforce-lightning-design-system.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="config.local.js"></script>
</head>
<body class="slds-scope">
  <main class="slds-box slds-var-m-around_medium">
    <header class="slds-page-header">
      <div class="slds-page-header__row">
        <div class="slds-page-header__col-title">
          <p class="slds-page-header__title-label">Irrigation Spatial</p>
          <h1 class="slds-page-header__title">Portable Mapping Prototype</h1>
        </div>
        <div class="slds-page-header__col-meta">
          <div class="slds-var-m-top_small">
            <p id="context-chip" class="slds-text-body_small slds-text-color_weak">Loading...</p>
          </div>
        </div>
      </div>
    </header>

    <section class="slds-grid slds-var-m-top_medium slds-gutters">
      <aside class="slds-col slds-size_3-of-12 slds-p-around_small">
        <div class="slds-card">
          <div class="slds-card__header slds-grid slds-has-flexi-truncate">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
              <div class="slds-media__figure">
                <span class="slds-icon_container slds-icon-utility-layers slds-current-color" title="Features">
                  <svg class="slds-icon slds-icon_small" aria-hidden="true" viewBox="0 0 24 24"><use xlink:href="#"></use></svg>
                </span>
              </div>
              <div class="slds-media__body">
                <h3 class="slds-card__header-title slds-text-heading_small">
                  Features <span id="feature-count" class="slds-badge slds-var-m-left_x-small">0</span>
                </h3>
              </div>
            </div>
          </div>
          <div class="slds-card__body slds-card__body_inner slds-var-p-vertical_small">
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_medium">Points, lines, and polygons linked to assets.</p>
            <ul id="feature-list" class="slds-list slds-has-dividers_top-space"></ul>
          </div>
        </div>
      </aside>

      <section class="slds-col slds-size_9-of-12 slds-p-around_small">
        <div class="slds-card">
          <div class="slds-card__header slds-var-p-bottom_small">
            <div class="toolbar-minimal">
              <div class="toolbar-group">
                <button data-tool="select" class="btn-icon tool-active" title="Select and edit geometry">↖️</button>
                <button data-tool="marker" class="btn-icon" title="Draw point">📍</button>
                <button data-tool="polyline" class="btn-icon" title="Draw line">📏</button>
                <button data-tool="polygon" class="btn-icon" title="Draw polygon">🔷</button>
              </div>
              <div class="toolbar-group">
                <button id="rename-btn" class="btn-icon" title="Rename feature" disabled>✏️</button>
                <button id="delete-btn" class="btn-icon btn-danger" title="Delete feature" disabled>🗑️</button>
                <button id="save-btn" class="btn-icon btn-success" title="Save to storage">💾</button>
                <button id="reload-btn" class="btn-icon" title="Reload from storage">🔄</button>
              </div>
            </div>
          </div>
          <div class="slds-card__body slds-card__body_inner">
            <div id="map-root" class="map-root slds-box slds-box_border"></div>
          </div>
          <div class="slds-card__footer slds-var-p-vertical_small slds-border_top">
            <p id="status" class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_none">Initializing...</p>
            <p id="hint" class="slds-text-body_x-small slds-text-color_weak slds-var-m-top_x-small slds-var-m-bottom_none">💡 Select a feature to enable rename/delete. Edits auto-save to localStorage when you click Save.</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <dialog id="rename-dialog" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
      <div class="slds-modal__header">
        <h2 class="slds-modal__title slds-hyphenate">Rename Feature</h2>
        <button id="rename-cancel-header" class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
          <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true" viewBox="0 0 24 24"><use xlink:href="#"></use></svg>
          <span class="slds-assistive-text">Close</span>
        </button>
      </div>
      <div class="slds-modal__content slds-var-p-around_medium">
        <div class="slds-form-element slds-var-m-bottom_medium">
          <label class="slds-form-element__label" for="rename-input">
            <span class="slds-text-required slds-required">*</span>
            Feature Name
          </label>
          <div class="slds-form-element__control">
            <input id="rename-input" class="slds-input" type="text" placeholder="Enter feature name" required />
          </div>
        </div>
      </div>
      <div class="slds-modal__footer slds-grid slds-grid_align-end slds-gap_x-small">
        <button id="rename-cancel" class="slds-button slds-button_neutral">Cancel</button>
        <button id="rename-confirm" class="slds-button slds-button_brand">Save</button>
      </div>
    </div>
  </dialog>
  <div id="rename-backdrop" class="slds-backdrop slds-backdrop_hide"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
